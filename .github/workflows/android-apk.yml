name: Build WORD PASSIONATE Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is empty or unavailable"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-app/app/word-passionate-release.jks
          test -s android-app/app/word-passionate-release.jks || { echo "Decoded keystore file is empty"; exit 1; }

      - name: Diagnose and validate signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" || { echo "ERROR: KEYSTORE_PASSWORD secret is empty or unavailable"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: KEY_ALIAS secret is empty or unavailable"; exit 1; }
          echo "Checking whether the decoded file is a readable keystore and whether the store password is correct..."
          if ! keytool -list -keystore android-app/app/word-passionate-release.jks -storepass "$KEYSTORE_PASSWORD"; then
            echo "ERROR: GitHub cannot open the decoded keystore with KEYSTORE_PASSWORD. Check that KEYSTORE_BASE64 is the exact current file and KEYSTORE_PASSWORD is exact. No secret values are printed."
            exit 1
          fi
          echo "Checking the requested key alias..."
          if ! keytool -list -keystore android-app/app/word-passionate-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"; then
            echo "ERROR: The store opened, but KEY_ALIAS was not found or could not be accessed."
            exit 1
          fi
          echo "Keystore, store password, and alias validated."

      - name: Create signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD secret is empty or unavailable"; exit 1; }
          cat > android-app/keystore.properties <<EOF
          storeFile=word-passionate-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed Release APK
        working-directory: android-app
        run: gradle assembleRelease --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WORD-PASSIONATE-Signed-APK
          path: android-app/app/build/outputs/apk/release/app-release.apk

      - name: Clean signing files
        if: always()
        run: |
          rm -f android-app/app/word-passionate-release.jks
          rm -f android-app/keystore.properties

# Keep the keystore inside the app module because Android resolves storeFile from that module.
