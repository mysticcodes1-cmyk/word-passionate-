name: Build WORD PASSIONATE Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build release APK (unsigned)
        working-directory: android-app
        run: gradle assembleRelease --no-daemon

      - name: Check APK exists
        run: |
          test -s android-app/app/build/outputs/apk/release/app-release-unsigned.apk ||           test -s android-app/app/build/outputs/apk/release/app-release.apk
          ls -lh android-app/app/build/outputs/apk/release/

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: WORD-PASSIONATE-Unsigned-APK
          path: |
            android-app/app/build/outputs/apk/release/app-release-unsigned.apk
            android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
